name: Cloud N1 OpenWrt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-n1-openwrt.yaml'
      - 'packaging/**'
      - 'script.sh'
      - 'config.sh'
  schedule:
    - cron: 0 8 * * 0

permissions:
  contents: write

concurrency:
  group: cloud-n1-openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  SCRIPT_SH: script.sh
  CONFIG_SH: config.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  KERNEL_VERSION: latest
  KERNEL_REPO_URL: breakingbadboy/OpenWrt
  KERNEL_TAG: stable
  DEFAULT_LAN_IP: 192.168.11.240
  FIRMWARE_DIST: Go-Laoji N1
  LUCI_DISPLAY: LuCI openwrt-25.12

jobs:
  build_openwrt:
    name: Build OpenWrt and release
    runs-on: ubuntu-22.04

    steps:

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: main

    - name: Disk space
      run: |
           echo "Free space:"
           df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-mark hold grub-efi-amd64-signed
        sudo -E apt-get -qq update --fix-missing
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full pahole patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        clang --version
        llvm-strip --version
        pahole --version

    - name: Clone source code
      id: source
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        useVersionInfo=$(git show -s --date=short --format="date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
        echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "tag_name=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "FIRMWARE_VERSION=R$(date +%y.%m.%d)" >> $GITHUB_ENV

    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/.ccache
          openwrt/dl
        key: n1-openwrt-${{ runner.os }}-armsr-${{ steps.source.outputs.revision }}-${{ hashFiles('config.sh', 'script.sh') }}
        restore-keys: |
          n1-openwrt-${{ runner.os }}-armsr-${{ steps.source.outputs.revision }}-
          n1-openwrt-${{ runner.os }}-armsr-

    - name: Update feeds
      run: |
        [ -e files ] && mv files openwrt/files
        chmod +x $SCRIPT_SH
        ./$SCRIPT_SH


    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        chmod +x $CONFIG_SH
        ./$CONFIG_SH

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        required_configs=(
          CONFIG_TARGET_armsr
          CONFIG_TARGET_armsr_armv8
          CONFIG_TARGET_armsr_armv8_DEVICE_generic
          CONFIG_CCACHE
          CONFIG_DEVEL
          CONFIG_BPF_TOOLCHAIN_HOST
          CONFIG_USE_LLVM_HOST
          CONFIG_HAS_BPF_TOOLCHAIN
          CONFIG_DAED_USE_KERNEL_BTF
          CONFIG_KERNEL_ARM_PMU
          CONFIG_KERNEL_BPF_EVENTS
          CONFIG_KERNEL_PERF_EVENTS
          CONFIG_KERNEL_XDP_SOCKETS
          CONFIG_PACKAGE_daed
          CONFIG_PACKAGE_frpc
          CONFIG_PACKAGE_btrfs-progs
          CONFIG_PACKAGE_dosfstools
          CONFIG_PACKAGE_e2fsprogs
          CONFIG_PACKAGE_kmod-fs-btrfs
          CONFIG_PACKAGE_kmod-fs-ext4
          CONFIG_PACKAGE_kmod-fs-vfat
          CONFIG_PACKAGE_kmod-nls-cp437
          CONFIG_PACKAGE_kmod-nls-iso8859-1
          CONFIG_PACKAGE_kmod-nls-utf8
          CONFIG_PACKAGE_kmod-sched-bpf
          CONFIG_PACKAGE_kmod-veth
          CONFIG_PACKAGE_kmod-xdp-sockets-diag
          CONFIG_PACKAGE_luci-app-argon-config
          CONFIG_PACKAGE_luci-app-daede
          CONFIG_PACKAGE_luci-app-daede_daed
          CONFIG_PACKAGE_luci-app-frpc
          CONFIG_PACKAGE_luci-app-quickstart
          CONFIG_PACKAGE_luci-app-store
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn
          CONFIG_PACKAGE_luci-i18n-frpc-zh-cn
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn
          CONFIG_PACKAGE_luci-theme-argon
          CONFIG_PACKAGE_quickstart
          CONFIG_TARGET_ROOTFS_TARGZ
        )
        for config in "${required_configs[@]}"; do
          if ! grep -qx "${config}=y" .config; then
            echo "Required build option was not resolved: ${config}=y"
            exit 1
          fi
        done
        grep -qx 'CONFIG_BPF_TOOLCHAIN_HOST_PATH="/usr"' .config
        excluded_packages=(
          MAC80211_DEBUGFS
          MAC80211_MESH
          adguardhome
          brcmfmac-firmware-usb
          cgroupfs-mount
          clashoo
          containerd
          ddns-go
          docker
          docker-lan-bridge
          dockerd
          dockermanager
          f2fs-tools
          f2fsck
          hostapd-common
          iw
          iwinfo
          kmod-asn1-encoder
          kmod-br-netfilter
          kmod-brcmfmac
          kmod-brcmutil
          kmod-cfg80211
          kmod-dax
          kmod-dm
          kmod-dummy
          kmod-ipt-physdev
          kmod-keys-encrypted
          kmod-keys-trusted
          kmod-mac80211
          kmod-nf-ipvs
          kmod-oid-registry
          kmod-tpm
          libseccomp
          luci-app-adguardhome
          luci-app-amlogic
          luci-app-clashoo
          luci-app-ddns-go
          luci-app-dockerman
          luci-app-dockermanager
          luci-i18n-clashoo-zh-cn
          luci-i18n-ddns-go-zh-cn
          luci-lib-docker
          luci-theme-opentomcat
          liblxc
          lxc
          lxc-auto
          lxc-common
          lxc-configs
          lxc-hooks
          lxc-init
          lxc-templates
          lxc-unprivileged
          luci-app-lxc
          runc
          tini
          wireless-regdb
          wpa-cli
          wpad-basic
          wpad-basic-mbedtls
          xfs-fsck
          xfs-mkfs
        )
        for package in "${excluded_packages[@]}"; do
          if grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
            echo "Excluded package was selected: ${package}"
            exit 1
          fi
        done
        excluded_configs=(
          CONFIG_BRCMFMAC_PCIE
          CONFIG_BRCMFMAC_SDIO
          CONFIG_BRCMFMAC_USB
          CONFIG_DRIVER_11AC_SUPPORT
          CONFIG_KERNEL_CFQ_GROUP_IOSCHED
          CONFIG_KERNEL_CGROUP_DEVICE
          CONFIG_KERNEL_CGROUP_FREEZER
          CONFIG_KERNEL_CGROUP_HUGETLB
          CONFIG_KERNEL_CGROUP_NET_PRIO
          CONFIG_KERNEL_CGROUP_PERF
          CONFIG_KERNEL_HUGETLBFS
          CONFIG_KERNEL_HUGETLB_PAGE
          CONFIG_KERNEL_MEMCG_SWAP_ENABLED
          CONFIG_KERNEL_NET_CLS_CGROUP
          CONFIG_KERNEL_TRANSPARENT_HUGEPAGE
          CONFIG_KERNEL_TRANSPARENT_HUGEPAGE_ALWAYS
        )
        for config in "${excluded_configs[@]}"; do
          if grep -qx "${config}=y" .config; then
            echo "Excluded build option was selected: ${config}=y"
            exit 1
          fi
        done
        CCACHE_DIR="$PWD/.ccache" ccache --max-size=5G
        grep -E '^CONFIG_(TARGET_armsr|DEVEL|BPF_TOOLCHAIN|USE_LLVM|HAS_BPF_TOOLCHAIN)' .config
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        CCACHE_DIR="$PWD/.ccache" ccache --show-stats
        echo "======================="
        echo "Space usage:"
        echo "======================="
        df -h
        echo "======================="
        du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
        du -h --max-depth=1 ./build_dir
        du -h --max-depth=1 ./bin
        rm -rf ./build_dir
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Resolve latest kernel version
      id: resolve_kernel
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        kernel_api="https://github.com/${KERNEL_REPO_URL}/releases/expanded_assets/kernel_${KERNEL_TAG}"

        if [[ "$KERNEL_VERSION" == "latest" ]]; then
          latest_version="$(curl -fsSL "$kernel_api" | grep -oP "(?<=[/>])[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)" | sort -urV | head -n 1)"
        elif [[ "$KERNEL_VERSION" =~ \.y$ ]]; then
          kernel_series="$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1"."$2}')"
          kernel_regex="${kernel_series//./\\.}"
          latest_version="$(curl -fsSL "$kernel_api" | grep -oP "(?<=[/>])${kernel_regex}\.[0-9]+(?=\.tar\.gz)" | sort -urV | head -n 1)"
        else
          echo "Using fixed kernel version: $KERNEL_VERSION"
          echo "RESOLVED_KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -z "$latest_version" ]]; then
          echo "Unable to resolve latest kernel version from $kernel_api"
          exit 1
        fi

        echo "Resolved latest kernel version: $latest_version"
        echo "KERNEL_VERSION=$latest_version" >> $GITHUB_ENV
        echo "RESOLVED_KERNEL_VERSION=$latest_version" >> $GITHUB_ENV
        echo "kernel_version=$latest_version" >> "$GITHUB_OUTPUT"

    - name: Package ARM64 rootfs as OpenWrt
      uses: ophub/flippy-openwrt-actions@main
      env:
        OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
        PACKAGE_SOC: diy
        SCRIPT_DIY_PATH: packaging/mk_s905d_n1_nowifi.sh
        OPENWRT_IP: ${{ env.DEFAULT_LAN_IP }}
        KERNEL_REPO_URL: ${{ env.KERNEL_REPO_URL }}
        KERNEL_VERSION_NAME: ${{ steps.resolve_kernel.outputs.kernel_version }}
        KERNEL_AUTO_LATEST: false
        SAVE_OPENWRT_ROOTFS: false
        ENABLE_WIFI_K510: 0
        WHOAMI: go-laoji

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/armsr/armv8
        rm -rf packages sha256sums version.buildinfo feeds.buildinfo openwrt-armsr-armv8-generic-kernel.bin openwrt-armsr-armv8-generic.manifest
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware
        path: |
            ${{ env.FIRMWARE }}
            ${{ env.PACKAGED_OUTPUTPATH }}

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.DATE }} ❤️ | N1-OpenWrt 自动编译打包
        allowUpdates: true
        tag: ${{ env.tag_name }}
        commit: main
        token: ${{ github.token }}
        body: |
          编译使用版本:
          ${{ env.useVersionInfo }}

          刷机固件简介：
            打包日期：${{ env.PACKAGED_OUTPUTDATE }}
            固件版本：${{ env.FIRMWARE_DIST }} ${{ env.FIRMWARE_VERSION }}
            内核版本：${{ env.KERNEL_VERSION }}
            默认IP：${{ env.DEFAULT_LAN_IP }} 默认用户名密码： root/password
        artifacts: "${{ env.FIRMWARE }}/*.*,${{ env.PACKAGED_OUTPUTPATH }}/*.*"

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
